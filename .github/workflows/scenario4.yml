name: Scenario 4 — ECS Fargate + ALB

on:
  push:
    branches: [main]
    paths:
      - "terraform/scenario4/**"
      - "src/scenario4/**"
  pull_request:
    paths:
      - "terraform/scenario4/**"
      - "src/scenario4/**"
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: "Run Terraform apply"
        type: boolean
        default: false
      deploy_app:
        description: "Build and deploy container"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.2"
  AWS_REGION: "ap-southeast-2"
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: "devops-agent-demo-demo-s4-app"
  ECS_CLUSTER: "devops-agent-demo-demo-s4-cluster"
  ECS_SERVICE: "devops-agent-demo-demo-s4-app"

jobs:
  # ── Terraform ─────────────────────────────────────────────────────────────
  terraform:
    name: Terraform ${{ github.event_name == 'push' && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    if: contains(github.event.commits[0].modified, 'terraform/scenario4') || github.event.inputs.deploy_infra == 'true' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: terraform/scenario4

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/devops-agent-demo-demo-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch foundation outputs
        id: foundation
        run: |
          VPC_ID=$(aws ssm get-parameter --name /devops-agent-demo/foundation/vpc_id --query Parameter.Value --output text)
          PUB_SUBNETS=$(aws ssm get-parameter --name /devops-agent-demo/foundation/public_subnet_ids --query Parameter.Value --output text)
          PRIV_SUBNETS=$(aws ssm get-parameter --name /devops-agent-demo/foundation/private_subnet_ids --query Parameter.Value --output text)
          echo "vpc_id=${VPC_ID}" >> $GITHUB_OUTPUT
          echo "public_subnet_ids=${PUB_SUBNETS}" >> $GITHUB_OUTPUT
          echo "private_subnet_ids=${PRIV_SUBNETS}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Plan
        run: |
          terraform plan -input=false -no-color \
            -var="vpc_id=${{ steps.foundation.outputs.vpc_id }}" \
            -var='public_subnet_ids=${{ steps.foundation.outputs.public_subnet_ids }}' \
            -var='private_subnet_ids=${{ steps.foundation.outputs.private_subnet_ids }}' \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

  # ── Container build & deploy ────────────────────────────────────────────
  deploy-app:
    name: Build & Deploy Container
    runs-on: ubuntu-latest
    needs: terraform
    if: |
      always() &&
      (github.ref == 'refs/heads/main') &&
      (contains(github.event.commits[0].modified, 'src/scenario4') || github.event.inputs.deploy_app == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/devops-agent-demo-demo-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG src/scenario4/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: build-image

      - name: Update ECS service with new image
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition devops-agent-demo-demo-s4-app \
            --query taskDefinition)

          NEW_TASK_DEF=$(echo $TASK_DEF | jq \
            --arg IMAGE "${{ steps.build-image.outputs.image }}" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF"

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition devops-agent-demo-demo-s4-app

      - name: Wait for deployment to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
