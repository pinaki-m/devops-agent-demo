name: Scenario 2 — MWAA + EMR Serverless Infra

on:
  push:
    branches: [main]
    paths:
      - "terraform/scenario2/**"
  pull_request:
    paths:
      - "terraform/scenario2/**"
  workflow_dispatch:
    inputs:
      vpc_id:
        description: "VPC ID (override foundation output)"
        required: false
      private_subnet_ids:
        description: "Comma-separated private subnet IDs"
        required: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.2"
  AWS_REGION: "ap-southeast-2"

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'push' && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/scenario2

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/devops-agent-demo-demo-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch foundation outputs
        id: foundation
        run: |
          VPC_ID=$(aws ssm get-parameter --name /devops-agent-demo/foundation/vpc_id --query Parameter.Value --output text 2>/dev/null || echo "${{ github.event.inputs.vpc_id }}")
          SUBNETS=$(aws ssm get-parameter --name /devops-agent-demo/foundation/private_subnet_ids --query Parameter.Value --output text 2>/dev/null || echo "${{ github.event.inputs.private_subnet_ids }}")
          echo "vpc_id=${VPC_ID}" >> $GITHUB_OUTPUT
          echo "private_subnet_ids=${SUBNETS}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -no-color \
            -var="vpc_id=${{ steps.foundation.outputs.vpc_id }}" \
            -var='private_subnet_ids=["${{ steps.foundation.outputs.private_subnet_ids }}"]' \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
